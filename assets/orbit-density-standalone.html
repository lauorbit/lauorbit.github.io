}

.form-check:not(.form-switch)
  .form-check-input:not(:disabled):not(:checked):hover {
  background-color: var(--card);
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;]:checked {
  border-color: var(--primary);
  background-color: var(--primary);
}

.form-check:not(.form-switch)
  .form-check-input[type=&quot;checkbox&quot;]:checked::before {
  display: block;
  width: 100%;
  height: 100%;
  background: var(--primary-foreground);
  content: &quot;&quot;;
  mask: var(--checkmark-image) center / 12px 12px no-repeat;
}

.form-check-input[type=&quot;radio&quot;] {
  width: 14px;
  height: 14px;
  border-radius: var(--radius-full);
}

.form-check-input[type=&quot;radio&quot;]:checked {
  border: 2px solid var(--primary);
  background:
    radial-gradient(circle, var(--primary-foreground) 0 2.5px, transparent 3px),
    var(--primary);
}

.form-check:not(.form-switch) .form-check-input:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

.form-check:not(.form-switch) .form-check-input:disabled {
  cursor: not-allowed;
  pointer-events: none;
}

.form-check:not(.form-switch) .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
}

.form-switch .form-check-input:disabled,
.form-switch .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
  opacity: 0.6;
}

.form-check-label {
  color: var(--foreground);
  cursor: var(--cursor-interaction, default);
}

.form-switch .form-check-input {
  position: relative;
  width: 32px;
  height: 20px;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
  box-shadow: none;
  transition: background-color 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input::before {
  position: absolute;
  top: 50%;
  left: 0;
  width: 16px;
  height: 16px;
  box-sizing: border-box;
  border: 1px solid light-dark(var(--primary-foreground), var(--foreground));
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
  box-shadow: var(--shadow-sm);
  content: &quot;&quot;;
  transform: translate(2px, -50%);
  transition: transform 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input:checked {
  background: var(--primary);
}

.form-switch .form-check-input:checked::before {
  transform: translate(14px, -50%);
}

.form-switch .form-check-input:focus-visible {
  box-shadow: 0 0 0 2px var(--ring);
}

.form-range {
  appearance: none;
  display: block;
  width: 100%;
  height: 28px;
  flex: 1;
  margin: 0;
  padding: 0;
  outline: none;
  border: 0;
  accent-color: var(--primary);
  background: linear-gradient(
      color-mix(in srgb, var(--foreground) 7%, transparent),
      color-mix(in srgb, var(--foreground) 7%, transparent)
    )
    center / 100% 2px no-repeat;
}

.form-range::-webkit-slider-runnable-track {
  height: 28px;
  background: transparent;
}

.form-range::-webkit-slider-thumb {
  appearance: none;
  width: 20px;
  height: 20px;
  margin-top: 4px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-webkit-slider-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.btn:not(.btn-primary, .viz-tile):is(
  [aria-pressed=&quot;true&quot;],
  [aria-selected=&quot;true&quot;],
  .is-selected
) {
  border-color: var(--primary);
  color: var(--primary-foreground);
  background: var(--primary);
}

.btn.viz-tile:is([aria-pressed=&quot;true&quot;], [aria-selected=&quot;true&quot;], .is-selected) {
  border-color: var(--primary);
  box-shadow: inset 0 0 0 1px var(--primary);
}

.btn:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

@media (pointer: coarse) {
  .btn,
  .form-control,
  .form-select {
    min-width: 44px;
    min-height: 44px;
  }

  .form-control,
  .form-select {
    font-size: max(16px, var(--font-size-normal));
  }

  .form-control[type=&quot;file&quot;]::file-selector-button {
    min-width: 44px;
    min-height: 44px;
  }

  .form-control-color[type=&quot;color&quot;] {
    width: 44px;
    height: 44px;
  }

  .form-control:is(
    [type=&quot;date&quot;],
    [type=&quot;datetime-local&quot;],
    [type=&quot;month&quot;],
    [type=&quot;time&quot;],
    [type=&quot;week&quot;]
  ) {
    min-width: 0;
    max-width: 100%;
    padding-block: 8px;
  }

  .form-check {
    min-height: 44px;
    padding-inline: 15px;
  }

  .form-check-input {
    position: relative;
  }

  .form-check-input::after {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 44px;
    height: 44px;
    content: &quot;&quot;;
    transform: translate(-50%, -50%);
  }

  .form-check-label {
    display: inline-flex;
    min-width: 44px;
    min-height: 44px;
    align-items: center;
  }

  .form-range {
    height: 44px;
    touch-action: pan-y;
  }

  .form-range::-webkit-slider-runnable-track {
    height: 44px;
  }

  .form-range::-moz-range-track {
    height: 44px;
  }

  .form-range::-webkit-slider-thumb {
    margin-top: 12px;
  }
}

svg {
  display: block;
  max-width: 100%;
  height: auto;
}

#widget &gt; svg {
  width: 100%;
}

/* Model-authored chart rules can otherwise stretch icons after these styles load. */
svg.lucide {
  display: block;
  width: 16px !important;
  height: 16px !important;
  flex: none;
  margin: 0 !important;
  stroke-width: 1.6;
}

.text-warning,
.text-destructive {
  color: var(--destructive);
}

&lt;script&gt;
window.ORBIT_DATA_READY.then(() =&gt; {
  const root = document.getElementById(&quot;orbit-density-viz&quot;);
  const chart = root.querySelector(&quot;#odv-chart&quot;);
  const legend = root.querySelector(&quot;#odv-legend&quot;);
  const note = root.querySelector(&quot;#odv-note&quot;);
  const subtitle = root.querySelector(&quot;#odv-subtitle&quot;);
  const tooltip = root.querySelector(&quot;#odv-tooltip&quot;);
  const D = window.ORBIT_DENSITY;
  const colors = {KI:&quot;#0f9c95&quot;,JUFO:&quot;#189bd3&quot;,ABDC:&quot;#ee5a24&quot;,FNEGE:&quot;#e7a817&quot;,AJG:&quot;#a855b9&quot;,VHB:&quot;#76b947&quot;,Norwegian:&quot;#58b8e8&quot;,ORBIT:&quot;var(--odv-orbit-line)&quot;};
  const seriesOrder = [&quot;KI&quot;,&quot;JUFO&quot;,&quot;ABDC&quot;,&quot;FNEGE&quot;,&quot;AJG&quot;,&quot;VHB&quot;,&quot;Norwegian&quot;,&quot;ORBIT&quot;];
  const hidden = new Set();
  let view = &quot;scores&quot;;

  function showTip(event, html){
    tooltip.hidden = false; tooltip.innerHTML = html;
    const box = root.getBoundingClientRect();
    const x = Math.min(event.clientX - box.left + 12, box.width - 225);
    const y = Math.max(12, event.clientY - box.top - 36);
    tooltip.style.left = `${x}px`; tooltip.style.top = `${y}px`;
  }
  function hideTip(){ tooltip.hidden = true; }

  function frame(xDomain, yDomain, xLabel){
    chart.innerHTML = &quot;&quot;;
    const width = Math.max(320, chart.clientWidth), height = Math.max(320, chart.clientHeight);
    const margin = {top:20,right:22,bottom:55,left:66};
    const innerW = width-margin.left-margin.right, innerH=height-margin.top-margin.bottom;
    const svg = d3.select(chart).append(&quot;svg&quot;).attr(&quot;viewBox&quot;,`0 0 ${width} ${height}`).attr(&quot;preserveAspectRatio&quot;,&quot;xMidYMid meet&quot;);
    const g = svg.append(&quot;g&quot;).attr(&quot;transform&quot;,`translate(${margin.left},${margin.top})`);
    const x = d3.scaleLinear().domain(xDomain).range([0,innerW]);
    const y = d3.scaleLinear().domain(yDomain).nice().range([innerH,0]);
    g.append(&quot;g&quot;).attr(&quot;class&quot;,&quot;odv-grid&quot;).call(d3.axisLeft(y).ticks(5).tickSize(-innerW).tickFormat(&quot;&quot;));
    g.append(&quot;g&quot;).attr(&quot;class&quot;,&quot;odv-grid&quot;).attr(&quot;transform&quot;,`translate(0,${innerH})`).call(d3.axisBottom(x).ticks(width&lt;600?5:10).tickSize(-innerH).tickFormat(&quot;&quot;));
    g.append(&quot;g&quot;).attr(&quot;class&quot;,&quot;odv-axis&quot;).attr(&quot;transform&quot;,`translate(0,${innerH})`).call(d3.axisBottom(x).ticks(width&lt;600?5:10));
    g.append(&quot;g&quot;).attr(&quot;class&quot;,&quot;odv-axis&quot;).call(d3.axisLeft(y).ticks(5));
    g.append(&quot;text&quot;).attr(&quot;class&quot;,&quot;odv-axis-label&quot;).attr(&quot;x&quot;,innerW/2).attr(&quot;y&quot;,innerH+45).attr(&quot;text-anchor&quot;,&quot;middle&quot;).text(xLabel);
    g.append(&quot;text&quot;).attr(&quot;class&quot;,&quot;odv-axis-label&quot;).attr(&quot;transform&quot;,&quot;rotate(-90)&quot;).attr(&quot;x&quot;,-innerH/2).attr(&quot;y&quot;,-48).attr(&quot;text-anchor&quot;,&quot;middle&quot;).text(&quot;Probability density&quot;);
    return {svg,g,x,y,innerW,innerH,margin};
  }

  function drawScores(){
    subtitle.textContent = &quot;Comparative score distributions after the ASJC-specific ranking rule.&quot;;
    note.textContent = &quot;Gaussian KDE with common bandwidth h = 12. The vertical guides are the adopted D/C, C/B, B/A and A/A+ boundaries. Toggle systems above; move across the plot for exact curve values.&quot;;
    legend.innerHTML = &quot;&quot;;
    seriesOrder.forEach(name =&gt; {
      const b=document.createElement(&quot;button&quot;); b.type=&quot;button&quot;; b.dataset.series=name; b.className=hidden.has(name)?&quot;off&quot;:&quot;&quot;; b.setAttribute(&quot;aria-pressed&quot;,String(!hidden.has(name))); b.title=`Toggle ${name} curve`;
      b.innerHTML=`&lt;span class=&quot;odv-swatch&quot; style=&quot;background:${colors[name]}&quot;&gt;&lt;/span&gt;${name}`;
      b.onclick=()=&gt;{hidden.has(name)?hidden.delete(name):hidden.add(name);drawScores();}; legend.appendChild(b);
    });
    const active=seriesOrder.filter(s=&gt;!hidden.has(s));
    const ymax=d3.max(active.length?active:[&quot;ORBIT&quot;],s=&gt;d3.max(D.scoreCurves[s]))*1.08;
    const f=frame([0,100],[0,ymax],&quot;Percentile score (0–100)&quot;);
    const boundaryLabels=[&quot;D/C&quot;,&quot;C/B&quot;,&quot;B/A&quot;,&quot;A/A+&quot;];
    D.boundaries.forEach((v,i)=&gt;{f.g.append(&quot;line&quot;).attr(&quot;class&quot;,&quot;odv-boundary&quot;).attr(&quot;x1&quot;,f.x(v)).attr(&quot;x2&quot;,f.x(v)).attr(&quot;y2&quot;,f.innerH);f.g.append(&quot;text&quot;).attr(&quot;class&quot;,&quot;odv-boundary-label&quot;).attr(&quot;transform&quot;,`translate(${f.x(v)+9},14) rotate(-90)`).text(boundaryLabels[i]);});
    const line=d3.line().x((d,i)=&gt;f.x(D.scoreGrid[i])).y(d=&gt;f.y(d)).curve(d3.curveBasis);
    active.forEach(name=&gt;f.g.append(&quot;path&quot;).datum(D.scoreCurves[name]).attr(&quot;data-series&quot;,name).attr(&quot;fill&quot;,&quot;none&quot;).attr(&quot;stroke&quot;,colors[name]).attr(&quot;stroke-width&quot;,name===&quot;ORBIT&quot;?3.2:1.7).attr(&quot;stroke-dasharray&quot;,name===&quot;ORBIT&quot;?null:&quot;6 4&quot;).attr(&quot;d&quot;,line));
    const cross=f.g.append(&quot;line&quot;).attr(&quot;class&quot;,&quot;odv-crosshair&quot;).attr(&quot;y2&quot;,f.innerH).style(&quot;display&quot;,&quot;none&quot;);
    f.g.append(&quot;rect&quot;).attr(&quot;width&quot;,f.innerW).attr(&quot;height&quot;,f.innerH).attr(&quot;fill&quot;,&quot;transparent&quot;).on(&quot;mousemove&quot;,event=&gt;{
      const px=d3.pointer(event)[0], xv=Math.max(0,Math.min(100,f.x.invert(px)));
      const i=d3.bisectCenter(D.scoreGrid,xv); cross.style(&quot;display&quot;,null).attr(&quot;x1&quot;,f.x(D.scoreGrid[i])).attr(&quot;x2&quot;,f.x(D.scoreGrid[i]));
      const rows=active.map(name=&gt;`&lt;span class=&quot;odv-tip-swatch&quot; style=&quot;background:${colors[name]}&quot;&gt;&lt;/span&gt;${name}: ${D.scoreCurves[name][i].toFixed(4)}`).join(&quot;&lt;br&gt;&quot;); showTip(event,`&lt;b&gt;Score ${D.scoreGrid[i].toFixed(1)}&lt;/b&gt;&lt;br&gt;${rows}`);
    }).on(&quot;mouseleave&quot;,()=&gt;{cross.style(&quot;display&quot;,&quot;none&quot;);hideTip();});
  }

  function drawUncertainty(){
    subtitle.textContent = &quot;The actual distribution affected by the requested min–max normalization.&quot;;
    legend.innerHTML = &quot;&quot;;
    note.textContent = `Boundary-corrected Gaussian KDE with h = ${D.summary.bandwidth.toFixed(2)}. Raw uncertainty minimum and maximum map exactly to 0 and 1; Quality &amp; Quantity is ${D.qualityAndQuantity.normalizedUncertainty.toFixed(4)}.`;
    const ymax=d3.max(D.uncertaintyDensity)*1.08;
    const f=frame([0,1],[0,ymax],&quot;Normalized uncertainty, (x − xmin) / (xmax − xmin)&quot;);
    const area=d3.area().x((d,i)=&gt;f.x(D.uncertaintyGrid[i])).y0(f.y(0)).y1(d=&gt;f.y(d)).curve(d3.curveBasis);
    const line=d3.line().x((d,i)=&gt;f.x(D.uncertaintyGrid[i])).y(d=&gt;f.y(d)).curve(d3.curveBasis);
    f.g.append(&quot;path&quot;).datum(D.uncertaintyDensity).attr(&quot;d&quot;,area).attr(&quot;fill&quot;,&quot;#168aad&quot;).attr(&quot;opacity&quot;,.18);
    f.g.append(&quot;path&quot;).datum(D.uncertaintyDensity).attr(&quot;d&quot;,line).attr(&quot;fill&quot;,&quot;none&quot;).attr(&quot;stroke&quot;,&quot;#0b7285&quot;).attr(&quot;stroke-width&quot;,3);
    const markers=[{v:D.summary.median,n:&quot;Median&quot;,c:&quot;#7b2cbf&quot;},{v:D.summary.p90,n:&quot;90th percentile&quot;,c:&quot;#d97706&quot;},{v:D.qualityAndQuantity.normalizedUncertainty,n:&quot;Quality &amp; Quantity&quot;,c:&quot;#c92a2a&quot;}];
    markers.forEach(o=&gt;{f.g.append(&quot;line&quot;).attr(&quot;x1&quot;,f.x(o.v)).attr(&quot;x2&quot;,f.x(o.v)).attr(&quot;y2&quot;,f.innerH).attr(&quot;stroke&quot;,o.c).attr(&quot;stroke-width&quot;,1.7).attr(&quot;stroke-dasharray&quot;,&quot;6 4&quot;);const b=document.createElement(&quot;button&quot;);b.innerHTML=`&lt;span class=&quot;odv-swatch&quot; style=&quot;background:${o.c}&quot;&gt;&lt;/span&gt;${o.n}: ${o.v.toFixed(4)}`;legend.appendChild(b);});
    const cross=f.g.append(&quot;line&quot;).attr(&quot;class&quot;,&quot;odv-crosshair&quot;).attr(&quot;y2&quot;,f.innerH).style(&quot;display&quot;,&quot;none&quot;);
    f.g.append(&quot;rect&quot;).attr(&quot;width&quot;,f.innerW).attr(&quot;height&quot;,f.innerH).attr(&quot;fill&quot;,&quot;transparent&quot;).on(&quot;mousemove&quot;,event=&gt;{const px=d3.pointer(event)[0],xv=Math.max(0,Math.min(1,f.x.invert(px))),i=d3.bisectCenter(D.uncertaintyGrid,xv);cross.style(&quot;display&quot;,null).attr(&quot;x1&quot;,f.x(D.uncertaintyGrid[i])).attr(&quot;x2&quot;,f.x(D.uncertaintyGrid[i]));showTip(event,`&lt;b&gt;Normalized uncertainty ${D.uncertaintyGrid[i].toFixed(3)}&lt;/b&gt;&lt;br&gt;Density: ${D.uncertaintyDensity[i].toFixed(3)}`);}).on(&quot;mouseleave&quot;,()=&gt;{cross.style(&quot;display&quot;,&quot;none&quot;);hideTip();});
  }

  function draw(){ view===&quot;scores&quot;?drawScores():drawUncertainty(); }
  root.querySelectorAll(&quot;.odv-tabs button&quot;).forEach(btn=&gt;btn.addEventListener(&quot;click&quot;,()=&gt;{view=btn.dataset.view;root.querySelectorAll(&quot;.odv-tabs button&quot;).forEach(b=&gt;b.classList.toggle(&quot;active&quot;,b===btn));draw();}));
  new ResizeObserver(()=&gt;draw()).observe(chart); draw();
});
&lt;/script&gt;

&lt;script src=&quot;https://unpkg.com/@floating-ui/core@1.7.3/dist/floating-ui.core.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script src=&quot;https://unpkg.com/@floating-ui/dom@1.7.4/dist/floating-ui.dom.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script&gt;
(() =&gt; {
  if (window.FloatingUIDOM == null) {
    return;
  }
  const { autoUpdate, computePosition, flip, offset, shift, size } =
    window.FloatingUIDOM;
  const tooltipPlacements = new Set([&quot;top&quot;, &quot;right&quot;, &quot;bottom&quot;, &quot;left&quot;]);
  const tooltipId = `codex-visualization-tooltip-${
    window.crypto?.randomUUID?.() ?? Date.now().toString(36)
  }`;
  const tooltipGap = 5;
  const hoverDelay = 700;
  const skipDelay = 300;
  let activeTrigger = null;
  let pendingTrigger = null;
  let tooltip = null;
  let openTimeout = null;
  let autoUpdateCleanup = null;
  let positionRequest = 0;
  let skipDelayUntil = 0;
  let lastPointerWasTouch = false;
  let pinnedByTouch = false;

  const getTrigger = (target) =&gt;
    target?.nodeType === Node.ELEMENT_NODE
      ? target.closest(&quot;[data-tooltip]&quot;)
      : null;
  const containsTarget = (trigger, target) =&gt;
    target?.nodeType != null &amp;&amp; trigger.contains(target);
  const getContent = (trigger) =&gt;
    trigger.getAttribute(&quot;data-tooltip&quot;)?.trim() ?? &quot;&quot;;
  const getPlacement = (trigger) =&gt; {
    const placement = trigger.getAttribute(&quot;data-tooltip-placement&quot;);
    return tooltipPlacements.has(placement) ? placement : &quot;top&quot;;
  };
  const getTooltip = () =&gt; {
    if (tooltip == null) {
      tooltip = document.createElement(&quot;div&quot;);
      tooltip.id = tooltipId;
      tooltip.className = &quot;tooltip&quot;;
      tooltip.setAttribute(&quot;role&quot;, &quot;tooltip&quot;);
    }
    return tooltip;
  };
  const setDescribedBy = (trigger, described) =&gt; {
    const ids = new Set(
      (trigger.getAttribute(&quot;aria-describedby&quot;) ?? &quot;&quot;)
        .split(/\s+/)
        .filter(Boolean),
    );
    if (described) {
      ids.add(tooltipId);
    } else {
      ids.delete(tooltipId);
    }
    if (ids.size === 0) {
      trigger.removeAttribute(&quot;aria-describedby&quot;);
    } else {
      trigger.setAttribute(&quot;aria-describedby&quot;, [...ids].join(&quot; &quot;));
    }
  };
  const clearOpenTimeout = () =&gt; {
    if (openTimeout != null) {
      window.clearTimeout(openTimeout);
      openTimeout = null;
    }
    pendingTrigger = null;
  };
  const closeTooltip = (activateSkipDelay = true) =&gt; {
    clearOpenTimeout();
    pinnedByTouch = false;
    positionRequest += 1;
    autoUpdateCleanup?.();
    autoUpdateCleanup = null;
    if (activeTrigger == null) {
      return;
    }
    setDescribedBy(activeTrigger, false);
    activeTrigger = null;
    tooltip?.remove();
    if (activateSkipDelay) {
      skipDelayUntil = Date.now() + skipDelay;
    }
  };
  const updatePosition = (trigger, floating) =&gt; {
    const request = ++positionRequest;
    void computePosition(trigger, floating, {
      middleware: [
        offset(tooltipGap),
        flip({ padding: tooltipGap }),
        shift({ padding: tooltipGap }),
        size({
          padding: tooltipGap,
          apply({ availableHeight, availableWidth, elements }) {
            elements.floating.style.setProperty(
              &quot;--tooltip-available-width&quot;,
              `${Math.max(0, availableWidth)}px`,
            );
            elements.floating.style.setProperty(
              &quot;--tooltip-available-height&quot;,
              `${Math.max(0, availableHeight)}px`,
            );
          },
        }),
      ],
      placement: getPlacement(trigger),
      strategy: &quot;fixed&quot;,
    })
      .then(({ x, y }) =&gt; {
        if (activeTrigger !== trigger || request !== positionRequest) {
          return;
        }
        const scale = window.devicePixelRatio || 1;
        floating.style.transform = `translate(${Math.round(x * scale) / scale}px, ${Math.round(y * scale) / scale}px)`;
        floating.style.visibility = &quot;visible&quot;;
      })
      .catch(() =&gt; {
        if (activeTrigger === trigger &amp;&amp; request === positionRequest) {
          closeTooltip(false);
        }
      });
  };
  const openTooltip = (trigger) =&gt; {
    const content = getContent(trigger);
    if (!trigger.isConnected || content.length === 0) {
      return;
    }
    clearOpenTimeout();
    if (activeTrigger === trigger) {
      return;
    }
    closeTooltip();
    const floating = getTooltip();
    floating.textContent = content;
    floating.style.visibility = &quot;hidden&quot;;
    floating.style.transform = &quot;translate(0, 0)&quot;;
    document.body.appendChild(floating);
    activeTrigger = trigger;
    setDescribedBy(trigger, true);
    autoUpdateCleanup = autoUpdate(trigger, floating, () =&gt; {
      updatePosition(trigger, floating);
    });
  };
  const requestOpen = (trigger, immediate = false) =&gt; {
    if (
      getContent(trigger).length === 0 ||
      activeTrigger === trigger ||
      pendingTrigger === trigger
    ) {
      return;
    }
    clearOpenTimeout();
    pendingTrigger = trigger;
    const delay =
      immediate || activeTrigger != null || Date.now() &lt; skipDelayUntil
        ? 0
        : hoverDelay;
    if (delay === 0) {
      openTooltip(trigger);
      return;
    }
    openTimeout = window.setTimeout(() =&gt; {
      openTimeout = null;
      pendingTrigger = null;
      openTooltip(trigger);
    }, delay);
  };
  const handlePointerOpen = (event) =&gt; {
    if (event.pointerType === &quot;touch&quot;) {
      return;
    }
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    requestOpen(trigger);
  };
  const handlePointer = (event) =&gt; {
    lastPointerWasTouch =
      event.type === &quot;pointerdown&quot; &amp;&amp; event.pointerType === &quot;touch&quot;;
  };
  const handleTouchClick = (event) =&gt; {
    const isTouch = event.pointerType === &quot;touch&quot; || lastPointerWasTouch;
    lastPointerWasTouch = false;
    if (!isTouch || event.detail === 0) {
      return;
    }
    const trigger = getTrigger(event.target);
    if (
      trigger == null ||
      !trigger.isConnected ||
      getContent(trigger).length === 0 ||
      (pinnedByTouch &amp;&amp; activeTrigger === trigger)
    ) {
      if (pinnedByTouch) {
        closeTooltip();
      }
      return;
    }
    openTooltip(trigger);
    pinnedByTouch = activeTrigger === trigger;
    window.setTimeout(() =&gt; {
      if (activeTrigger === trigger &amp;&amp; !trigger.isConnected) {
        closeTooltip(false);
      }
    }, 0);
  };
  const handleLeave = (event) =&gt; {
    if (pinnedByTouch) {
      return;
    }
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const handleFocusIn = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger?.matches(&quot;:focus-visible&quot;)) {
      requestOpen(trigger, true);
    }
  };
  const handleKeyDown = (event) =&gt; {
    if (event.key === &quot;Escape&quot;) {
      closeTooltip();
    }
  };
  const handleContextMenu = (event) =&gt; {
    lastPointerWasTouch = false;
    const trigger = getTrigger(event.target);
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const destroy = () =&gt; {
    closeTooltip(false);
    lastPointerWasTouch = false;
    document.removeEventListener(&quot;pointerover&quot;, handlePointerOpen);
    document.removeEventListener(&quot;pointerdown&quot;, handlePointer);
    document.removeEventListener(&quot;pointercancel&quot;, handlePointer);
    document.removeEventListener(&quot;click&quot;, handleTouchClick);
    document.removeEventListener(&quot;pointerout&quot;, handleLeave);
